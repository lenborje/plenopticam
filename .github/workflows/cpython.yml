name: CPython compatibility

on:
  push:
    branches: [master, fix/cpython314-illum]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package with isolated builds
        run: python -m pip install . build
      - name: Verify dependencies and core imports
        run: |
          python -m pip check
          python -c 'from plenopticam import lfp_reader, lfp_calibrator, lfp_aligner, lfp_extractor, lfp_refocuser'
      - name: Run offline compatibility regressions
        run: >-
          python -m unittest
          tests.unit_test_compat tests.unit_test_decoder_compat
          tests.unit_test_illum_archive tests.unit_test_depth_compat
          tests.unit_test_cli tests.unit_test_err
          tests.unit_test_plt.PlenopticamTesterPlt.test_point_cloud
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_mla_geometry_estimate
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_grid_gen
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_grid_rotation_fit
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_decomposition
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_sorted_fitting
          tests.unit_test_calib.PlenoptiCamTesterCalib.test_mla_dims_estimate -v
      - name: Build wheel and source distribution
        run: |
          git show HEAD:plenopticam/cfg/cfg.json > plenopticam/cfg/cfg.json
          python -m build
